name: Build ACREPT Enumerator APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ACREPT-Enumerator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ACREPT-Enumerator-apk
          path: ACREPT-Enumerator.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ACREPT-Enumerator.apk --title "ACREPT Enumerator (latest build)" --notes "Debug build from commit ${GITHUB_SHA::7}. Install on Android 8.0 or newer." --latest
      - name: Store APK on the apk-builds branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp ACREPT-Enumerator.apk /tmp/out/
          git checkout --orphan apk-builds
          git rm -rf . > /dev/null
          cp /tmp/out/ACREPT-Enumerator.apk .
          git add ACREPT-Enumerator.apk
          git commit -m "APK from ${GITHUB_SHA::7}"
          git push -f origin apk-builds
